[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chae"
version = "0.2.1"
description = "Causal Hierarchical Agent Engine — causal reasoning + hierarchical memory + symbolic planning + auto causal discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CHAE Contributors" }]
dependencies = ["numpy>=1.24", "networkx>=3.1"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
discovery = ["pcalg-py>=0.0.1"]
timeseries = ["statsmodels>=0.14", "pandas>=2.0"]
viz = ["flask>=3.0"]
demo = ["sentence-transformers>=2.2", "pcalg-py>=0.0.1", "statsmodels>=0.14", "pandas>=2.0", "flask>=3.0"]
dev = ["pytest>=7.4", "ruff>=0.3", "black>=24.0", "mypy>=1.8", "pre-commit>=3.6"]

[project.scripts]
chae = "chae.cli:main"

[tool.setuptools.packages.find]
include = ["chae*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"